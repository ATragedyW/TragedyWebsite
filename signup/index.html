<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join the Chaos // Tragedy</title>

    <link rel="stylesheet" href="/signup/signup.css">
</head>

<body>

    <a href="/" class="back-button">← BACK TO TRAGEDY</a>

    <main class="signup-page">

        <section class="signup-card">

            <div class="brand">
                <p class="brand-name">TRAGEDY</p>

                <h1>JOIN THE<br>CHAOS</h1>

                <p class="subtitle">
                    Create your account.
                </p>
            </div>

            <form id="signupForm">

                <div class="form-group">
                    <label for="username">USERNAME</label>

                    <input
                        type="text"
                        id="username"
                        autocomplete="username"
                        placeholder="tragedy"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">EMAIL</label>

                    <input
                        type="email"
                        id="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">PASSWORD</label>

                    <input
                        type="password"
                        id="password"
                        autocomplete="new-password"
                        placeholder="••••••••"
                        minlength="8"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        CONFIRM PASSWORD
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        autocomplete="new-password"
                        placeholder="••••••••"
                        minlength="8"
                        required
                    >
                </div>

                <p id="formMessage"></p>

                <button type="submit" class="signup-button">
                    CREATE ACCOUNT
                </button>

            </form>

            <div class="login">
                <span>Already part of the chaos?</span>
                <a href="/login/">LOG IN</a>
            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/signup/signup.js"></script>

</body>

</html>
