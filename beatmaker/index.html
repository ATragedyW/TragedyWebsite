<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tragedy // Beatmaker</title>

    <link rel="stylesheet" href="beatmaker.css">
</head>

<body>

    <header>
        <a href="/" class="back-button">← BACK TO TRAGEDY</a>
    </header>

    <main class="beatmaker">

        <div class="title">
            <p>TRAGEDY</p>
            <h1>BEATMAKER</h1>
            <span>WELCOME TO THE CHAOS</span>
        </div>

        <div class="controls">

            <div class="bpm-control">
                <label for="bpm">BPM</label>
                <input
                    type="number"
                    id="bpm"
                    value="128"
                    min="40"
                    max="240"
                >
            </div>

            <button id="playButton">▶ PLAY</button>
            <button id="stopButton">■ STOP</button>

        </div>
        <div id="iosAudioNotice" class="ios-audio-notice" hidden>
    <div class="ios-audio-notice-text">
        <strong>NO SOUND?</strong>
        <span>iPhone users: make sure Silent Mode is turned off.</span>
        </div>

        <button id="closeIosAudioNotice" type="button" aria-label="Close audio notice">
        ×
        </button>
        </div>
        <div class="sequencer" id="sequencer">

    <!-- KICK -->
    <div class="track" data-sound="kick">

        <div class="track-controls">
            <div class="track-name">KICK</div>

            <select class="sound-select" data-sound="kick">
                <option value="deep">DEEP</option>
                <option value="punchy">PUNCHY</option>
                <option value="house">HOUSE</option>
                <option value="808">808</option>
                <option value="distorted">DISTORTED</option>
            </select>
        </div>

        <div class="steps"></div>

    </div>


    <!-- SNARE -->
    <div class="track" data-sound="snare">

        <div class="track-controls">
            <div class="track-name">SNARE</div>

            <select class="sound-select" data-sound="snare">
                <option value="crisp">CRISP</option>
                <option value="trap">TRAP</option>
                <option value="acoustic">ACOUSTIC</option>
                <option value="tight">TIGHT</option>
                <option value="heavy">HEAVY</option>
            </select>
        </div>

        <div class="steps"></div>

    </div>


    <!-- CLAP -->
    <div class="track" data-sound="clap">

        <div class="track-controls">
            <div class="track-name">CLAP</div>

            <select class="sound-select" data-sound="clap">
                <option value="classic">CLASSIC</option>
                <option value="wide">WIDE</option>
                <option value="short">SHORT</option>
                <option value="bright">BRIGHT</option>
            </select>
        </div>

        <div class="steps"></div>

    </div>


    <!-- HI-HAT -->
    <div class="track" data-sound="hihat">

        <div class="track-controls">
            <div class="track-name">HI-HAT</div>

            <select class="sound-select" data-sound="hihat">
                <option value="classic">CLASSIC</option>
                <option value="trap">TRAP</option>
                <option value="lofi">LO-FI</option>
                <option value="metallic">METALLIC</option>
                <option value="soft">SOFT</option>
            </select>
        </div>

        <div class="steps"></div>

    </div>


    <!-- OPEN HAT -->
    <div class="track" data-sound="openhat">

        <div class="track-controls">
            <div class="track-name">OPEN HAT</div>

            <select class="sound-select" data-sound="openhat">
                <option value="classic">CLASSIC</option>
                <option value="long">LONG</option>
                <option value="bright">BRIGHT</option>
                <option value="dark">DARK</option>
            </select>
        </div>

        <div class="steps"></div>

    </div>

</div>

        <div class="bottom-controls">

            <div class="volume-control">
                <label for="masterVolume">MASTER</label>

                <input
                    type="range"
                    id="masterVolume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.8"
                >
            </div>
            <div class="beat-storage">

    <input
        type="text"
        id="beatName"
        maxlength="40"
        placeholder="BEAT NAME"
    >

    <button id="saveBeatButton">
        SAVE BEAT
    </button>

    <button id="loadBeatsButton">
        LOAD BEATS
    </button>

</div>


            <button id="clearButton">CLEAR PATTERN</button>

        </div>
        <p id="beatMessage"></p>
        <div id="savedBeatsPanel" class="saved-beats-panel" hidden>

    <div class="saved-beats-header">
        <div>
            <p>TRAGEDY // LIBRARY</p>
            <h2>SAVED BEATS</h2>
        </div>

        <button
            id="closeBeatsButton"
            type="button"
        >
            ✕
        </button>
    </div>

    <div id="savedBeatsList" class="saved-beats-list">
    </div>

</div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/beatmaker/beatmaker.js"></script>

</body>
</html>
